name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Dash and vocabulary gates
        run: |
          uv run python scripts/check_no_em_dash.py
          uv run python scripts/check_vocabulary.py
      - name: Claim gate (the story, the memo and every document re-rendered from the manifest and diffed)
        run: uv run python scripts/check_published_numbers.py
      - name: The statement on every document, the story and the memo
        run: uv run python scripts/check_statement.py
      - name: Identifier scan over everything published
        run: uv run python scripts/scan_for_planted_identifiers.py
      - name: Palette validator, both modes and the dark card
        run: node scripts/validate_palette.js --config web/src/theme/palette.json

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turnaround_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TURNAROUND_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/turnaround_test
      TURNAROUND_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tests with the coverage floor
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
