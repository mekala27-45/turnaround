[project]
name = "turnaround-contracts"
version = "0.1.0"
description = "Typed contracts for the BTS, FAA, OurAirports and Open-Meteo files, and the quarantine rules"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "turnaround-core",
  "duckdb>=1.1",
  "timezonefinder>=6.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnaround_contracts"]
