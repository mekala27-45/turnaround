[project]
name = "turnaround-misconnect"
version = "0.1.0"
description = "The misconnect curve per connection from the joint delay distribution, and the operating point"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "turnaround-core",
  "turnaround-stats",
  "duckdb>=1.1",
  "numpy>=1.26",
  "polars>=1.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnaround_misconnect"]
