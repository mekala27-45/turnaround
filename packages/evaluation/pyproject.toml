[project]
name = "turnaround-evaluation"
version = "0.1.0"
description = "The recovery study over simulator conditions and seeds"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "turnaround-core",
  "turnaround-sim",
  "turnaround-stats",
  "turnaround-rotations",
  "turnaround-events",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnaround_evaluation"]
