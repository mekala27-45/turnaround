[project]
name = "turnaround-exports"
version = "0.1.0"
description = "The workbook with live formulas, the BI extracts and specifications, the CSV bundle"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "turnaround-core",
  "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnaround_exports"]
