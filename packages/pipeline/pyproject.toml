[project]
name = "turnaround-pipeline"
version = "0.1.0"
description = "The command line that runs every stage in order and assembles the manifest"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "turnaround-core",
  "turnaround-render",
  "turnaround-contracts",
  "turnaround-sim",
  "turnaround-stats",
  "turnaround-rotations",
  "turnaround-chapters",
  "turnaround-events",
  "turnaround-misconnect",
  "turnaround-evaluation",
  "turnaround-exports",
  "typer>=0.15",
  "duckdb>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnaround_pipeline"]
