[project]
name = "turnaround-rotations"
version = "0.1.0"
description = "The aircraft day from tail numbers, the integrity rules and the inherited delay decomposition"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "turnaround-core",
  "turnaround-stats",
  "duckdb>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnaround_rotations"]
